
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamebusca - Pesquise jogos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b12;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px 8%;
      background: #15151f;
      border-bottom: 1px solid #292936;
      font-size: 24px;
      font-weight: bold;
      color: #a78bfa;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 70px 20px;
    }

    .hero {
      text-align: center;
      padding: 30px 0 60px;
    }

    h1 {
      font-size: clamp(36px, 6vw, 60px);
      margin-bottom: 20px;
    }

    h1 span {
      color: #a78bfa;
    }

    p {
      color: #aaaabb;
      line-height: 1.7;
    }

    form {
      display: flex;
      max-width: 600px;
      margin: 30px auto;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 16px;
      border: 1px solid #383346;
      border-radius: 8px;
      background: #191923;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 16px 22px;
      border: none;
      border-radius: 8px;
      background: #8b5cf6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    h2 {
      margin-bottom: 25px;
    }

    #jogos {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      padding: 22px;
      border: 1px solid #292936;
      background: #15151f;
      border-radius: 12px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    footer {
      padding: 30px;
      text-align: center;
      border-top: 1px solid #292936;
      color: #aaaabb;
    }

    @media (max-width: 500px) {
      form {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header>🎮 Gamebusca</header>

  <main>
    <section class="hero">
      <h1>Encontre seu próximo<br>
        <span>jogo favorito.</span>
      </h1>

      <p>Pesquise jogos e descubra novas aventuras!</p>

      <form id="pesquisa">
        <input
          id="busca"
          type="search"
          placeholder="Digite o nome de um jogo..."
        >
        <button type="submit">Pesquisar</button>
      </form>
    </section>

    <section>
      <h2>Jogos populares</h2>
      <div id="jogos"></div>
    </section>
  </main>

  <footer>Gamebusca © 2026</footer>

  <script>
    const catalogo = [
      { nome: "Minecraft", genero: "Aventura" },
      { nome: "GTA V", genero: "Ação" },
      { nome: "Elden Ring", genero: "RPG" },
      { nome: "Forza Horizon 5", genero: "Corrida" },
      { nome: "God of War", genero: "Ação" },
      { nome: "The Witcher 3", genero: "RPG" }
    ];

    const jogos = document.getElementById("jogos");
    const busca = document.getElementById("busca");
    const pesquisa = document.getElementById("pesquisa");

    function mostrarJogos(termo = "") {
      jogos.innerHTML = "";

      const encontrados = catalogo.filter(jogo =>
        jogo.nome.toLowerCase().includes(
          termo.toLowerCase().trim()
        )
      );

      if (encontrados.length === 0) {
        jogos.textContent = "Nenhum jogo encontrado.";
        return;
      }

      encontrados.forEach(jogo => {
        const card = document.createElement("article");
        card.className = "card";

        const titulo = document.createElement("h3");
        titulo.textContent = jogo.nome;

        const genero = document.createElement("p");
        genero.textContent = jogo.genero;

        card.append(titulo, genero);
        jogos.appendChild(card);
      });
    }

    pesquisa.addEventListener("submit", evento => {
      evento.preventDefault();
      mostrarJogos(busca.value);
    });

    busca.addEventListener("input", () => {
      mostrarJogos(busca.value);
    });

    mostrarJogos();
  </script>
</body>
</html>
